<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aero Metrix - AI Learning Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Mock Data ---
    const initialRecommendations = [
      { id: 1, title: "Introduction to Algebra", type: "Article", duration: "15 mins", gap: "High Priority", icon: "book-open" },
      { id: 2, title: "Cell Biology Basics", type: "Video", duration: "25 mins", gap: "Medium Priority", icon: "video" },
      { id: 3, title: "Essay Writing Fundamentals", type: "Article", duration: "20 mins", gap: "Low Priority", icon: "file-text" },
      { id: 4, title: "World War II Overview", type: "Video", duration: "30 mins", gap: "Medium Priority", icon: "play-circle" },
    ];

    const quickPrompts = [
      "Analyze my skill gaps",
      "Explain vector embeddings",
      "Suggest my learning path",
      "Help me prepare for tomorrow's quiz"
    ];

    function App() {
      // Auth State
      const [user, setUser] = useState(null); // null = logged out
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup'
      const [selectedRole, setSelectedRole] = useState('Officer / Learner');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [fullName, setFullName] = useState('');

      // Dashboard State
      const [activeTab, setActiveTab] = useState('Dashboard');

      // Chatbot State
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [messages, setMessages] = useState([
        { id: 1, sender: 'bot', text: 'Hello! I am AeroTutor, your 24/7 AI learning assistant. How can I help you with your courses today?', timestamp: 'Just now' }
      ]);
      const [inputMsg, setInputMsg] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const chatEndRef = useRef(null);

      // Auto scroll chat
      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages, isTyping, isChatOpen]);

      // Initialize icons after render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Handlers
      const handleLogin = (e) => {
        e.preventDefault();
        setUser({
          name: fullName || email.split('@')[0] || 'Officer User',
          email: email || 'user@igok.gov.in',
          role: selectedRole,
        });
      };

      const handleSSOLogin = () => {
        setUser({
          name: 'Officer Rajat Sharma',
          email: 'rajat.s@gov.in',
          role: 'Officer / Learner',
          sso: true
        });
      };

      const handleLogout = () => {
        setUser(null);
        setIsChatOpen(false);
      };

      const handleSendMessage = (textToSend) => {
        const query = textToSend || inputMsg;
        if (!query.trim()) return;

        const userMsg = {
          id: Date.now(),
          sender: 'user',
          text: query,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setMessages((prev) => [...prev, userMsg]);
        if (!textToSend) setInputMsg('');
        setIsTyping(true);

        // Simulate AI response stream
        setTimeout(() => {
          let botReply = "I've analyzed your request against your target competencies. Your strongest area is Data Analytics, but you currently have a 28% gap in Python RESTful APIs. I recommend starting with module 2!";
          
          if (query.toLowerCase().includes('gap') || query.toLowerCase().includes('analyze')) {
            botReply = "Based on your recent assessment, your critical skill gaps are in Vector Databases (ChromaDB) and API Validation. I have updated your personalized path.";
          } else if (query.toLowerCase().includes('vector')) {
            botReply = "Vector embeddings transform text into numeric representations in high-dimensional space, enabling similarity search in vector stores like ChromaDB and Qdrant.";
          } else if (query.toLowerCase().includes('path') || query.toLowerCase().includes('suggest')) {
            botReply = "Recommended Path: 1. Python FastAPI Middleware -> 2. Vector Indexing -> 3. Interactive Quiz Practice.";
          }

          setMessages((prev) => [
            ...prev,
            {
              id: Date.now() + 1,
              sender: 'bot',
              text: botReply,
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }
          ]);
          setIsTyping(false);
        }, 1200);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          {/* HEADER / NAVIGATION */}
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                  AM
                </div>
                <div>
                  <span className="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
                    Aero Metrix
                  </span>
                  <span className="hidden sm:inline-block ml-2 text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-mono">
                   
                  </span>
                </div>
              </div>

              {user && (
                <div className="flex items-center space-x-4">
                  <div className="text-right hidden sm:block">
                    <p className="text-sm font-semibold text-slate-200">{user.name}</p>
                    <p className="text-xs text-indigo-400">{user.role}</p>
                  </div>
                  <button
                    onClick={handleLogout}
                    className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg border border-slate-700 transition flex items-center space-x-1"
                  >
                    <span>Logout</span>
                  </button>
                </div>
              )}
            </div>
          </header>

          {/* MAIN CONTENT CONTAINER */}
          {!user ? (
            /* AUTHENTICATION VIEW */
            <main className="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 relative overflow-hidden">
                <div className="absolute top-0 right-0 -mt-12 -mr-12 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <div className="text-center mb-6">
                  <h2 className="text-2xl font-bold text-white">Welcome to Aero Metrix</h2>
                  <p className="text-slate-400 text-sm mt-1">AI-Enabled Personalised Learning Platform</p>
                </div>

                {/* iGOT SSO Button */}
                <button
                  onClick={handleSSOLogin}
                  className="w-full py-3 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-medium rounded-xl shadow-lg shadow-emerald-900/30 transition flex items-center justify-center space-x-2 border border-emerald-500/30 mb-6 group"
                >
                  <svg className="w-5 h-5 text-emerald-200 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                  </svg>
                  <span>Sign in with iGOT Karmayogi SSO</span>
                </button>

                <div className="relative flex items-center justify-center mb-6">
                  <div className="border-t border-slate-800 w-full"></div>
                  <span className="bg-slate-900 px-3 text-xs text-slate-500 uppercase tracking-wider font-mono">Or standard login</span>
                </div>

                {/* Role Selector */}
                <div className="mb-4">
                  <label className="block text-xs font-semibold uppercase text-slate-400 mb-2">Select User Role</label>
                  <div className="grid grid-cols-3 gap-2 p-1 bg-slate-950 rounded-xl border border-slate-800 text-xs">
                    {['Officer / Learner', 'Trainer / Admin', 'MoSPI Admin'].map((role) => (
                      <button
                        key={role}
                        type="button"
                        onClick={() => setSelectedRole(role)}
                        className={`py-2 px-1 text-center rounded-lg font-medium transition ${
                          selectedRole === role
                            ? 'bg-indigo-600 text-white shadow'
                            : 'text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        {role.split('/')[0]}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Mode Switcher (Login / Signup) */}
                <div className="flex border-b border-slate-800 mb-6">
                  <button
                    onClick={() => setAuthMode('login')}
                    className={`flex-1 pb-2 text-sm font-medium text-center border-b-2 ${
                      authMode === 'login' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'
                    }`}
                  >
                    Sign In
                  </button>
                  <button
                    onClick={() => setAuthMode('signup')}
                    className={`flex-1 pb-2 text-sm font-medium text-center border-b-2 ${
                      authMode === 'signup' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'
                    }`}
                  >
                    Register
                  </button>
                </div>

                {/* Form */}
                <form onSubmit={handleLogin} className="space-y-4">
                  {authMode === 'signup' && (
                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">Full Name</label>
                      <input
                        type="text"
                        required
                        value={fullName}
                        onChange={(e) => setFullName(e.target.value)}
                        placeholder="e.g. Ramesh Kumar"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition"
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
                    <input
                      type="email"
                      required
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      placeholder="name@government.in"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Password</label>
                    <input
                      type="password"
                      required
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="••••••••"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full mt-2 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200"
                  >
                    {authMode === 'login' ? 'Sign In to Dashboard' : 'Create Aero Metrix Account'}
                  </button>
                </form>
              </div>
            </main>
          ) : (
            /* DASHBOARD VIEW */
            <div className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col lg:flex-row gap-6">
              
              {/* Sidebar Navigation */}
              <aside className="w-full lg:w-64 space-y-2">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                  <p className="text-xs font-bold uppercase text-slate-500 px-3 mb-2 tracking-wider">Navigation</p>
                  {[
                    { name: 'Dashboard', icon: 'layout-dashboard' },
                    { name: 'Learning Path', icon: 'compass' },
                    { name: 'Gap Assessment', icon: 'target' },
                    { name: 'Content Library', icon: 'book' },
                    { name: 'Analytics', icon: 'bar-chart-2' }
                  ].map((tab) => (
                    <button
                      key={tab.name}
                      onClick={() => setActiveTab(tab.name)}
                      className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${
                        activeTab === tab.name
                          ? 'bg-indigo-600 text-white shadow-md'
                          : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                      }`}
                    >
                      <span>{tab.name}</span>
                    </button>
                  ))}
                </div>

                {/* AI Status Card */}
                <div className="bg-gradient-to-br from-indigo-950 to-slate-900 border border-indigo-800/50 rounded-2xl p-4">
                  <div className="flex items-center space-x-2 text-indigo-400 mb-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span className="text-xs font-bold uppercase tracking-wider">AI Engine Active</span>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    Personalized Gap Detection is tracking your continuous progress.
                  </p>
                </div>
              </aside>

              {/* Main Content Area */}
              <main className="flex-1 space-y-6">
                
                {/* Welcome Banner */}
                <div className="bg-gradient-to-r from-indigo-900/60 via-slate-900 to-slate-900 border border-indigo-800/40 rounded-2xl p-6 relative overflow-hidden">
                  <div className="relative z-10">
                    <h1 className="text-2xl font-bold text-white">Welcome back, {user.name}! 👋</h1>
                    <p className="text-slate-300 text-sm mt-1 max-w-xl">
                      Ready to continue your learning journey? AI has detected 2 high-priority skill gaps to address today.
                    </p>
                  </div>
                </div>

                {/* Metrics Stats */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <p className="text-xs font-medium text-slate-400 uppercase">Learning Streak</p>
                    <p className="text-2xl font-bold text-indigo-400 mt-1">7 Days 🔥</p>
                    <p className="text-xs text-slate-500 mt-1">+2 days from last week</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <p className="text-xs font-medium text-slate-400 uppercase">Skill Gap Addressed</p>
                    <p className="text-2xl font-bold text-emerald-400 mt-1">68%</p>
                    <p className="text-xs text-slate-500 mt-1">Target: 85% competency</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <p className="text-xs font-medium text-slate-400 uppercase">Hours Spent</p>
                    <p className="text-2xl font-bold text-cyan-400 mt-1">12.5 hrs</p>
                    <p className="text-xs text-slate-500 mt-1">Faster skill acquisition active</p>
                  </div>
                </div>

                {/* AI Recommendations List */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="text-lg font-bold text-white flex items-center space-x-2">
                      <span>AI Recommendations for You</span>
                    </h2>
                    <span className="text-xs text-indigo-400 font-mono">Dynamic Gap Matching</span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {initialRecommendations.map((item) => (
                      <div key={item.id} className="bg-slate-950 border border-slate-800 p-4 rounded-xl hover:border-indigo-500/50 transition group">
                        <div className="flex items-start justify-between">
                          <span className="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 font-medium">
                            {item.type} • {item.duration}
                          </span>
                          <span className={`text-xs px-2 py-0.5 rounded font-mono ${
                            item.gap === 'High Priority' ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                          }`}>
                            {item.gap}
                          </span>
                        </div>
                        <h3 className="font-semibold text-slate-200 mt-3 group-hover:text-indigo-300 transition">{item.title}</h3>
                        <button className="mt-4 w-full py-2 bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white rounded-lg text-xs font-medium transition border border-indigo-500/30">
                          Start Module
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

              </main>
            </div>
          )}

          {/* FLOATING 24/7 AI CHATBOT ASSISTANT ("AeroTutor") */}
          {user && (
            <div className="fixed bottom-6 right-6 z-50">
              {!isChatOpen ? (
                <button
                  onClick={() => setIsChatOpen(true)}
                  className="bg-indigo-600 hover:bg-indigo-500 text-white rounded-full p-4 shadow-2xl shadow-indigo-600/50 flex items-center space-x-2 group transition-all duration-300 transform hover:scale-105"
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                  </svg>
                  <span className="font-medium text-sm pr-1">Ask AeroTutor AI</span>
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                </button>
              ) : (
                <div className="bg-slate-900 border border-slate-700 w-80 sm:w-96 rounded-2xl shadow-2xl flex flex-col h-[520px] overflow-hidden transition-all duration-300">
                  
                  {/* Chat Header */}
                  <div className="bg-slate-950 p-4 border-b border-slate-800 flex items-center justify-between">
                    <div className="flex items-center space-x-3">
                      <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-xs text-white">
                        AI
                      </div>
                      <div>
                        <h3 className="font-bold text-sm text-white leading-none">AeroTutor AI</h3>
                        <span className="text-[10px] text-emerald-400 flex items-center gap-1 mt-1">
                          <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> 24/7 Real-Time Doubt Solving
                        </span>
                      </div>
                    </div>
                    <button
                      onClick={() => setIsChatOpen(false)}
                      className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 text-lg font-bold"
                    >
                      ✕
                    </button>
                  </div>

                  {/* Chat Messages Body */}
                  <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-900/50">
                    {messages.map((msg) => (
                      <div
                        key={msg.id}
                        className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}
                      >
                        <div
                          className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-xs leading-relaxed ${
                            msg.sender === 'user'
                              ? 'bg-indigo-600 text-white rounded-br-none'
                              : 'bg-slate-800 border border-slate-700 text-slate-200 rounded-bl-none'
                          }`}
                        >
                          {msg.text}
                        </div>
                        <span className="text-[10px] text-slate-500 mt-1 px-1">{msg.timestamp}</span>
                      </div>
                    ))}

                    {isTyping && (
                      <div className="flex items-center space-x-2 bg-slate-800 border border-slate-700 rounded-2xl rounded-bl-none px-4 py-2.5 w-20">
                        <span className="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce"></span>
                        <span className="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                        <span className="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                      </div>
                    )}
                    <div ref={chatEndRef} />
                  </div>

                  {/* Quick Prompts */}
                  <div className="p-2 bg-slate-950 border-t border-slate-800 overflow-x-auto flex space-x-1.5 no-scrollbar">
                    {quickPrompts.map((prompt, idx) => (
                      <button
                        key={idx}
                        onClick={() => handleSendMessage(prompt)}
                        className="whitespace-nowrap text-[10px] bg-slate-800 hover:bg-indigo-900/50 hover:text-indigo-300 text-slate-300 border border-slate-700 px-2.5 py-1 rounded-full transition"
                      >
                        {prompt}
                      </button>
                    ))}
                  </div>

                  {/* Input Box */}
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      handleSendMessage();
                    }}
                    className="p-3 bg-slate-950 border-t border-slate-800 flex items-center space-x-2"
                  >
                    <input
                      type="text"
                      value={inputMsg}
                      onChange={(e) => setInputMsg(e.target.value)}
                      placeholder="Ask any doubt or topic..."
                      className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                    />
                    <button
                      type="submit"
                      className="bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-xl transition"
                    >
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                      </svg>
                    </button>
                  </form>
                </div>
              )}
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800 bg-slate-950 py-4 text-center text-xs text-slate-500">
            Aero Metrix • Smart India Hackathon 2025 • Software Education Theme
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
