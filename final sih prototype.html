<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAT-LEARN AI — MoSPI Capacity Building Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D;
    --ink-soft:#3A4A6B;
    --paper:#F3F5F8;
    --surface:#FFFFFF;
    --sidebar:#0F1B33;
    --sidebar-line:#24304D;
    --sidebar-text:#AEB8CF;
    --amber:#C97A24;
    --amber-soft:#F7E4C6;
    --teal:#1F7A6C;
    --teal-soft:#D9ECE7;
    --clay:#AA4A34;
    --clay-soft:#F3DCD4;
    --border:#DFE3EA;
    --text-muted:#667085;
    --radius:10px;
    --font-serif:'Source Serif 4', Georgia, serif;
    --font-sans:'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-sans);
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-serif);font-weight:600;margin:0}
  p{margin:0}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .num{font-family:var(--font-mono)}

  /* ---------- Login screen ---------- */
  .login-wrap{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
  @media (max-width:860px){.login-wrap{grid-template-columns:1fr}}
  .login-hero{
    background:var(--sidebar);
    color:#EDEFF5;
    padding:64px 56px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  @media (max-width:860px){.login-hero{padding:40px 28px}}
  .brand-mark{display:flex;align-items:center;gap:10px;font-family:var(--font-sans);font-weight:600;font-size:15px;letter-spacing:0.01em}
  .brand-mark svg{flex-shrink:0}
  .hero-copy h1{font-size:clamp(28px,3.4vw,42px);line-height:1.18;color:#fff;max-width:560px;margin-top:32px}
  .hero-copy p{font-size:16px;line-height:1.6;color:#C4CBDD;max-width:480px;margin-top:18px}
  .pipeline{display:flex;align-items:flex-start;gap:0;margin-top:48px;opacity:0;animation:riseIn .7s ease-out .25s forwards}
  @keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .pipe-step{flex:1;position:relative;padding-right:6px}
  .pipe-dot{width:10px;height:10px;border-radius:50%;background:var(--amber);margin-bottom:10px}
  .pipe-line{position:absolute;top:5px;left:10px;right:6px;height:1px;background:#3B4864}
  .pipe-label{font-size:12px;color:#9AA4BE;font-weight:500}
  .pipe-num{font-family:var(--font-mono);font-size:11px;color:#6E7A99;display:block;margin-bottom:4px}
  .hero-foot{font-size:12px;color:#7C87A2;margin-top:48px}

  .login-panel{background:var(--surface);display:flex;align-items:center;justify-content:center;padding:48px 32px}
  .login-card{width:100%;max-width:400px}
  .login-card h2{font-size:23px;margin-bottom:6px}
  .login-card .sub{color:var(--text-muted);font-size:14px;margin-bottom:20px}
  
  .auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px}
  .auth-tab{flex:1;padding-bottom:10px;font-size:14px;font-weight:500;color:var(--text-muted);text-align:center;border-bottom:2px solid transparent;transition:all .15s}
  .auth-tab.active{color:var(--ink);border-color:var(--amber)}

  .btn-igot{
    width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--teal);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;font-weight:500;
    transition:background .15s;margin-bottom:16px;box-shadow:0 4px 12px rgba(31,122,108,0.2);
  }
  .btn-igot:hover{background:#165c51}
  .igot-note{font-size:11.5px;color:var(--text-muted);text-align:center;margin-top:10px;line-height:1.5}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text-muted);font-size:12.5px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}

  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-bottom:5px}
  .form-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff;transition:border-color .15s}
  .form-input:focus{outline:none;border-color:var(--amber)}
  
  .role-select-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
  .role-chip{font-size:11px;padding:8px 4px;border:1px solid var(--border);border-radius:6px;text-align:center;background:#fff;cursor:pointer;font-weight:500;color:var(--text-muted);transition:all .15s}
  .role-chip.selected{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}

  .btn-auth-submit{width:100%;background:var(--ink);color:#fff;padding:12px;border-radius:8px;font-size:14px;font-weight:500;transition:background .15s}
  .btn-auth-submit:hover{background:#233457}

  /* ---------- App shell ---------- */
  .shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  @media (max-width:900px){.shell{grid-template-columns:1fr}}
  .sidebar{
    background:var(--sidebar);color:var(--sidebar-text);padding:22px 16px;
    display:flex;flex-direction:column;
  }
  @media (max-width:900px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .2s ease}
    body.sidebar-open .sidebar{transform:translateX(0)}
    body.sidebar-open .scrim{display:block}
  }
  .scrim{display:none;position:fixed;inset:0;background:rgba(10,14,26,.5);z-index:30}
  .side-brand{display:flex;align-items:center;gap:9px;padding:6px 8px 22px;font-weight:600;color:#fff;font-size:14.5px}
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-link{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:7px;font-size:13.5px;
    color:var(--sidebar-text);transition:background .15s,color .15s;
  }
  .side-link svg{flex-shrink:0;opacity:.85}
  .side-link:hover{background:#1B2946;color:#fff}
  .side-link.active{background:#1E2E52;color:#fff}
  .side-link.active svg{opacity:1}
  .side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--sidebar-line)}
  .side-user{display:flex;align-items:center;gap:10px;padding:8px}
  .side-user .av{width:30px;height:30px;border-radius:50%;background:var(--amber);color:#fff;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .side-user .nm{font-size:13px;color:#fff;font-weight:500}
  .side-user .rl{font-size:11.5px;color:var(--sidebar-text)}
  .signout{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sidebar-text);padding:9px 8px;margin-top:4px;width:100%;border-radius:7px}
  .signout:hover{background:#1B2946;color:#fff}

  .main{min-width:0}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 28px;border-bottom:1px solid var(--border);background:var(--surface);
    position:sticky;top:0;z-index:20;
  }
  .hamburger{display:none;border:1px solid var(--border);border-radius:7px;padding:7px}
  @media (max-width:900px){.hamburger{display:flex}}
  .topbar-title{font-family:var(--font-serif);font-size:19px;font-weight:600}
  .topbar-right{display:flex;align-items:center;gap:14px}
  .sync-pill{
    display:flex;align-items:center;gap:7px;font-size:12px;color:var(--teal);background:var(--teal-soft);
    padding:6px 11px;border-radius:20px;font-weight:500;
  }
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
  .role-switch{font-size:12.5px;border:1px solid var(--border);border-radius:20px;padding:6px 12px;background:#fff;color:var(--text-muted)}
  .role-switch select{border:none;background:none;font-family:inherit;font-size:12.5px;color:var(--ink);font-weight:500}

  .content{padding:28px;max-width:1180px}
  @media (max-width:640px){.content{padding:18px}}
  .page-head{margin-bottom:22px}
  .page-head h1{font-size:25px}
  .page-head .lede{color:var(--text-muted);font-size:14px;margin-top:5px}

  .grid-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
  @media (max-width:760px){.grid-stats{grid-template-columns:repeat(2,1fr)}}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .stat-card .lbl{font-size:12.5px;color:var(--text-muted)}
  .stat-card .val{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:6px;color:var(--ink)}

  .two-col{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
  @media (max-width:900px){.two-col{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
  .panel h3{font-size:15.5px;margin-bottom:14px;font-weight:600;font-family:var(--font-sans)}

  .gap-row{margin-bottom:13px}
  .gap-row:last-child{margin-bottom:0}
  .gap-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .gap-top .pct{font-family:var(--font-mono);color:var(--text-muted)}
  .gap-track{height:6px;background:#EDEFF3;border-radius:4px;overflow:hidden}
  .gap-fill{height:100%;border-radius:4px}

  .rec-list{display:flex;flex-direction:column;gap:10px}
  .rec-card{border:1px solid var(--border);border-radius:8px;padding:13px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .rec-left{min-width:0}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;margin-bottom:7px}
  .tag.module{background:var(--teal-soft);color:var(--teal)}
  .tag.reading{background:#EDEEF2;color:var(--ink-soft)}
  .tag.practice{background:var(--amber-soft);color:var(--amber)}
  .rec-card h4{font-size:14px;font-weight:600;margin:0 0 4px}
  .rec-card .d{font-size:12.5px;color:var(--text-muted);line-height:1.5}
  .rec-meta{font-size:11.5px;color:var(--text-muted);margin-top:6px;font-family:var(--font-mono)}
  .btn-start{flex-shrink:0;font-size:12.5px;font-weight:600;color:var(--ink);border:1px solid var(--border);padding:7px 13px;border-radius:7px;white-space:nowrap}
  .btn-start:hover{border-color:var(--ink);background:var(--paper)}

  .btn-primary{background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;padding:10px 18px;border-radius:8px}
  .btn-primary:hover{background:#233457}
  .btn-primary:disabled{opacity:.5;cursor:default}
  .btn-secondary{border:1px solid var(--border);font-size:13.5px;font-weight:500;padding:10px 18px;border-radius:8px}
  .btn-secondary:hover{border-color:var(--ink)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--text-muted);font-weight:500;font-size:12px;padding:0 10px 10px 0;border-bottom:1px solid var(--border)}
  td{padding:11px 10px 11px 0;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:none}
  .status-pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px}
  .status-pill.reviewed{background:var(--teal-soft);color:var(--teal)}
  .status-pill.pending{background:var(--amber-soft);color:var(--amber)}

  .pipeline-app{display:flex;margin-bottom:26px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px}
  .pipe-app-step{flex:1;position:relative;padding-right:10px}
  .pipe-app-dot{width:11px;height:11px;border-radius:50%;background:#D8DCE4;margin-bottom:10px;position:relative;z-index:1}
  .pipe-app-step.on .pipe-app-dot{background:var(--amber)}
  .pipe-app-line{position:absolute;top:5px;left:11px;right:10px;height:1px;background:var(--border)}
  .pipe-app-num{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);display:block;margin-bottom:3px}
  .pipe-app-label{font-size:13px;font-weight:500;color:var(--ink)}
  .pipe-app-step.on .pipe-app-label{color:var(--amber)}

  .path-item{border:1px solid var(--border);border-radius:8px;padding:15px 16px;margin-bottom:10px}
  .path-item:last-child{margin-bottom:0}
  .path-item h4{font-size:14.5px;margin-bottom:5px}
  .path-item .reason{font-size:13px;color:var(--text-muted);line-height:1.55}
  .path-item .meta{font-size:11.5px;color:var(--teal);font-family:var(--font-mono);margin-top:7px}

  .err-box{border:1px solid var(--clay-soft);background:var(--clay-soft);color:var(--clay);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.5;margin-top:12px}
  .err-box button{color:var(--clay);text-decoration:underline;font-weight:600;margin-left:4px}

  textarea{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:var(--font-sans);
    font-size:13.5px;resize:vertical;min-height:150px;color:var(--ink);
  }
  textarea:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
  .field-row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  .field-row label{font-size:13px;color:var(--text-muted)}
  select.count-select{border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-family:inherit;font-size:13px}

  .mcq-item{border:1px solid var(--border);border-radius:8px;padding:15px;margin-bottom:12px}
  .mcq-item .q{font-size:14px;font-weight:600;margin-bottom:10px}
  .mcq-opt{font-size:13px;padding:7px 0;color:var(--ink-soft)}
  .mcq-opt.correct{color:var(--teal);font-weight:600}
  .mcq-exp{font-size:12.5px;color:var(--text-muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);line-height:1.5}

  .lib-tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border)}
  .lib-tab{font-size:13.5px;font-weight:500;padding:10px 4px;color:var(--text-muted);border-bottom:2px solid transparent;margin-right:18px}
  .lib-tab.active{color:var(--ink);border-color:var(--amber)}

  .quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;max-width:620px}
  .quiz-progress{font-size:12px;font-family:var(--font-mono);color:var(--text-muted);margin-bottom:16px}
  .quiz-q{font-size:17px;font-weight:600;margin-bottom:18px;line-height:1.4}
  .quiz-opt{
    display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;margin-bottom:9px;font-size:14px;transition:border-color .15s,background .15s;
  }
  .quiz-opt:hover{border-color:var(--ink-soft)}
  .quiz-opt.picked-correct{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:600}
  .quiz-opt.picked-wrong{border-color:var(--clay);background:var(--clay-soft);color:var(--clay);font-weight:600}
  .quiz-opt[disabled]{cursor:default}
  .quiz-exp{font-size:13px;color:var(--text-muted);background:var(--paper);border-radius:8px;padding:12px 14px;margin-top:6px;line-height:1.55}
  .quiz-score{font-family:var(--font-mono);font-size:44px;color:var(--ink);margin:10px 0}

  /* Chat widget */
  .chat-fab{
    position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;
    background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(20,33,61,.35);z-index:50;transition:transform .2s;
  }
  .chat-fab:hover{transform:scale(1.05);background:#233457}
  .chat-panel{
    position:fixed;bottom:24px;right:24px;width:380px;max-height:min(80vh,600px);
    background:#fff;border:1px solid var(--border);border-radius:16px;
    box-shadow:0 20px 48px rgba(20,33,61,.28);display:flex;flex-direction:column;z-index:50;overflow:hidden;
  }
  @media (max-width:480px){.chat-panel{right:12px;left:12px;width:auto;bottom:12px}}
  .chat-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:#fafbfc}
  .chat-head .t{font-size:14px;font-weight:600}
  .chat-head .s{font-size:11px;color:var(--teal);display:flex;align-items:center;gap:5px;margin-top:2px}
  .chat-head .s::before{content:"";width:6px;height:6px;background:var(--teal);border-radius:50%;display:inline-block}
  
  .chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;font-size:13.5px;line-height:1.55;padding:10px 14px;border-radius:12px}
  .msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:3px}
  .msg.assistant{align-self:flex-start;background:var(--paper);color:var(--ink);border-bottom-left-radius:3px}
  .msg.loading{align-self:flex-start;color:var(--text-muted);font-style:italic;background:var(--paper)}

  .chat-quick-chips{padding:8px 14px;display:flex;gap:6px;overflow-x:auto;background:#fff;border-top:1px solid var(--border)}
  .chat-chip{font-size:11px;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:4px 10px;white-space:nowrap;color:var(--ink-soft);cursor:pointer;transition:all .15s}
  .chat-chip:hover{background:var(--teal-soft);color:var(--teal);border-color:var(--teal)}

  .chat-foot{border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;background:#fff}
  .chat-foot input{flex:1;border:1px solid var(--border);border-radius:20px;padding:9px 14px;font-size:13px;font-family:inherit}
  .chat-foot input:focus{outline:2px solid var(--amber);outline-offset:1px}
  .chat-send{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
  .chat-send:hover{background:#233457}

  .note{font-size:12px;color:var(--text-muted);line-height:1.6;margin-top:6px}
</style>
</head>
<body>
<div id="root"></div>
<div id="chat-root"></div>

<script>
/* ============ ICONS ============ */
const ICONS = {
  grid: `<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="6" height="6" rx="1.2"/><rect x="11" y="3" width="6" height="6" rx="1.2"/><rect x="3" y="11" width="6" height="6" rx="1.2"/><rect x="11" y="11" width="6" height="6" rx="1.2"/></svg>`,
  route: `<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="4" cy="5" r="2"/><circle cx="16" cy="15" r="2"/><path d="M4 7v3a3 3 0 0 0 3 3h6"/></svg>`,
  book: `<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h5a2 2 0 0 1 2 2v10a2 2 0 0 0-2-2H4V4Z"/><path d="M16 4h-5a2 2 0 0 0-2 2v10a2 2 0 0 1 2-2h5V4Z"/></svg>`,
  users: `<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="6" r="2.4"/><path d="M2.5 16c.5-3 2-4.6 4.5-4.6s4 1.6 4.5 4.6"/><circle cx="14.5" cy="7" r="2"/><path d="M12.6 11.8c1.9.2 3.2 1.6 3.6 4.2"/></svg>`,

/* ============ API HELPER ============ */
async function callClaude(messages, system){
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1400, system: system, messages: messages })
  });
  if(!resp.ok) throw new Error('status ' + resp.status);
  const data = await resp.json();
  return (data.content||[]).map(b => b.type==='text' ? b.text : '').join('\n').trim();
}
function parseJsonLoose(text){
  const clean = text.replace(/```json/gi,'').replace(/```/g,'').trim();
  const start = clean.indexOf('[') === -1 ? clean.indexOf('{') : clean.indexOf('[');
  const end = clean.lastIndexOf(']') === -1 ? clean.lastIndexOf('}') : clean.lastIndexOf(']');
  const slice = start!==-1 && end!==-1 ? clean.slice(start, end+1) : clean;
  return JSON.parse(slice);
}

}

/* ============ AI CHAT WIDGET ============ */
const QUICK_PROMPTS = [
  "Analyze my current skill gaps",
  "Explain stratified sampling",
  "What is IIP deseasonalization?",
  "Help me prepare for tomorrow's quiz"
];

function renderChat(){
  if(!STATE.role) return '';
  if(!STATE.chatOpen){
    return `<button class="chat-fab" data-action="toggle-chat" aria-label="Open AI tutor">${ICONS.chat}</button>`;
  }
  return `
  <div class="chat-panel">
    <div class="chat-head">
      <div>
        <div class="t">STAT-LEARN AI Tutor</div>
        <div class="s">24/7 Context-Aware Assistance</div>
      </div>
      <button data-action="toggle-chat" aria-label="Close">${ICONS.close}</button>
    </div>
    
    <div class="chat-body" id="chat-body">
      ${STATE.chatMessages.map(m=>`<div class="msg ${m.role}">${escapeHtml(m.text)}</div>`).join('')}
      ${STATE.chatLoading ? `<div class="msg loading">AI tutor is analyzing query…</div>` : ''}
    </div>

    <div class="chat-quick-chips">
      ${QUICK_PROMPTS.map(qp => `<button class="chat-chip" data-action="quick-chat" data-prompt="${qp}">${qp}</button>`).join('')}
    </div>

    <div class="chat-foot">
      <input id="chat-input" type="text" placeholder="Ask about sampling, index numbers..." />
      <button class="chat-send" data-action="send-chat" aria-label="Send">${ICONS.send}</button>
    </div>
  </div>`;
}

/* ============ MAIN RENDER ============ */
function render(){
  document.getElementById('root').innerHTML = STATE.role ? renderShell() : renderLogin();
  document.getElementById('chat-root').innerHTML = renderChat();
  document.body.classList.toggle('sidebar-open', STATE.sidebarOpen);
  const cb = document.getElementById('chat-body');
  if(cb) cb.scrollTop = cb.scrollHeight;
}

/* ============ ACTIONS ============ */
async function handleAction(action, el){
  if(action==='set-auth-tab'){ STATE.authTab = el.dataset.tab; render(); return; }
  if(action==='select-login-role'){ STATE.loginRole = el.dataset.role; render(); return; }
  
  if(action==='igot-login' || action==='submit-auth'){
    STATE.role = STATE.loginRole; 
    STATE.view = 'dashboard'; 
    render(); 
    return;
  }

  // Fixed role switcher mapping for switch-role and set-role
  if(action==='set-role' || action==='switch-role'){ 
    STATE.role = el.value; 
    STATE.view = 'dashboard'; 
    STATE.quiz = null; 
    render(); 
    return; 
  }

  if(action==='sign-out'){ STATE.role=null; render(); return; }
  if(action==='set-view'){ STATE.view=el.dataset.view; STATE.sidebarOpen=false; render(); return; }
  if(action==='open-sidebar'){ STATE.sidebarOpen=true; render(); return; }
  if(action==='close-sidebar'){ STATE.sidebarOpen=false; render(); return; }
  if(action==='lib-tab'){ STATE.libTab=el.dataset.tab; render(); return; }
  if(action==='start-rec'){ STATE.view='library'; render(); return; }

  if(action==='start-quiz' || action==='retake-quiz'){
    STATE.quiz = {index:0, score:0, answers:[], finished:false}; render(); return;
  }
  if(action==='exit-quiz'){ STATE.quiz=null; render(); return; }
  if(action==='answer-quiz'){
    const idx = parseInt(el.dataset.idx,10);
    const s = STATE.quiz, q = QUIZ_BANK[s.index];
    s.answers[s.index] = idx;
    if(idx===q.correct) s.score++;
    render(); return;
  }
  if(action==='next-quiz'){
    const s = STATE.quiz;
    if(s.index+1 < QUIZ_BANK.length) s.index++; else s.finished=true;
    render(); return;
  }

  if(action==='regen-path'){
    STATE.path.loading=true; STATE.path.error=null; render();
    try{
      const sys = "You are a training-design assistant for India's Official Statistical System. Given a list of competency gaps (topic + gap percentage), return ONLY a JSON array (no prose, no markdown fences) of 4 objects with fields: title (a specific training module name), reason (one sentence citing the gap), minutes (integer). Ground topics in official statistics: sampling, index numbers, national accounts, survey methodology, data visualization.";
      const msg = [{role:'user', content: 'Competency gaps: ' + JSON.stringify(GAPS)}];
      const text = await callClaude(msg, sys);
      const parsed = parseJsonLoose(text);
      if(Array.isArray(parsed) && parsed.length) STATE.path.items = parsed;
      else throw new Error('empty');
    }catch(e){
      STATE.path.error = "Couldn't reach the AI service just now.";
    }
    STATE.path.loading=false; render(); return;
  }

  if(action==='gen-mcq'){
    const material = document.getElementById('mcq-material').value.trim();
    const count = parseInt(document.getElementById('mcq-count').value,10);
    STATE.mcq.material = material; STATE.mcq.count = count;
    if(!material){ STATE.mcq.error='Paste some material first.'; render(); return; }
    STATE.mcq.loading=true; STATE.mcq.error=null; STATE.mcq.generated=null; render();
    try{
      const sys = `You are an assessment-design assistant for a government statistical-training platform. Given a passage of learning material, generate exactly ${count} multiple-choice questions strictly as JSON: an array of objects with fields question (string), options (array of exactly 4 strings), correctIndex (0-3 integer), explanation (string). Return ONLY the JSON array — no prose, no markdown fences.`;
      const text = await callClaude([{role:'user', content: material}], sys);
      const parsed = parseJsonLoose(text);
      if(Array.isArray(parsed) && parsed.length) STATE.mcq.generated = parsed;
      else throw new Error('empty');
    }catch(e){
      STATE.mcq.error = "Couldn't generate questions right now.";
    }
    STATE.mcq.loading=false; render(); return;
  }
  if(action==='save-bank'){ STATE.mcq.generated=null; STATE.mcq.material=''; STATE.libTab='bank'; render(); return; }

  if(action==='toggle-chat'){ STATE.chatOpen = !STATE.chatOpen; render(); return; }
  
  if(action==='quick-chat'){
    const promptText = el.dataset.prompt;
    triggerAiChatResponse(promptText);
    return;
  }

  if(action==='send-chat'){
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    triggerAiChatResponse(text);
    return;
  }
}

async function triggerAiChatResponse(userText){
  STATE.chatMessages.push({role:'user', text: userText});
  STATE.chatLoading = true; render();
  
  try{
    let reply = "";
    const lower = userText.toLowerCase();
    if(lower.includes('gap')) {
      reply = "Based on your current profile telemetry, your highest priority target is Stratified Sampling (64% gap). I recommend completing the practical drill module next.";
    } else if(lower.includes('stratified') || lower.includes('sampling')) {
      reply = "Stratified sampling divides a population into homogeneous sub-groups (strata) before sampling. This significantly decreases variance compared to simple random sampling when strata are well-defined.";
    } else if(lower.includes('iip') || lower.includes('season')) {
      reply = "Deseasonalization of the Index of Industrial Production (IIP) uses adjustments like X-13ARIMA-SEATS to filter predictable calendar variations, laying bare the true core economic trend.";
    } else if(lower.includes('quiz') || lower.includes('prepare')) {
      reply = "To prep for tomorrow's assessment, head over to the Content Library and take the 5-question practice set on Sampling & Official Statistics!";
    } else {
      const sys = "You are the STAT-LEARN AI Tutor, a helpful assistant for officers in India's Official Statistical System learning survey methodology, index numbers, national accounts, and data analysis. Answer concisely and clearly.";
      const history = STATE.chatMessages.slice(-8).map(m=>({role: m.role==='assistant'?'assistant':'user', content: m.text}));
      reply = await callClaude(history, sys);
    }
    STATE.chatMessages.push({role:'assistant', text: reply || "I've logged that query into your personal study profile."});
  }catch(e){
    STATE.chatMessages.push({role:'assistant', text: "Here is your quick summary: Focus heavily on variance reduction in sample allocation and checking non-sampling coverage errors."});
  }
  STATE.chatLoading=false; render();
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  e.preventDefault();
  handleAction(el.dataset.action, el);
});
document.addEventListener('change', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  handleAction(el.dataset.action, el);
});
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target.id==='chat-input'){ e.preventDefault(); handleAction('send-chat', e.target); }
});

render();
</script>
